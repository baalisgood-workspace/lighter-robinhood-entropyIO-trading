# lighter-robinhood-entropyIO-trading configuration
#
# Venue toggle: enable EXACTLY TWO venues to trade (live). One process arbitrages one
# pair: maker (post-only) on one venue, IOC hedge (taker) on the other.
#   lighter     = Lighter mainnet perps              (fees 0)
#   lighter_rh  = Lighter on Robinhood Chain          (fees 0, chain id 466324)
#   entropy     = Entropy, Hyperliquid HIP-3 dex "io" (io:OAI, io:ANTH, io:SNDK ...)
#   arcus       = Arcus perps                         (Base tier: maker 0, taker 0.0225%)
# Pick the pair on the command line instead of editing this file, and run several pairs
# in parallel, one terminal / service each:
#   python -m arb live --venues lighter,arcus
#   python -m arb live --venues lighter_rh,entropy
venues:
  lighter:
    enabled: true
    maker_fee_pct: 0.0
    taker_fee_pct: 0.0
    requests_per_minute: 60
  lighter_rh:
    enabled: true
    maker_fee_pct: 0.0
    taker_fee_pct: 0.0
    requests_per_minute: 60      # RH standard accounts: keep conservative
  entropy:
    enabled: false
    dex: io
    # Entropy base fees are maker 0.030% / taker 0.090%. Growth-mode markets (OAI, ANTH at launch)
    # pay 10% of that: 0.003% / 0.009%. If a symbol is NOT in growth mode, set 0.03 / 0.09 here.
    maker_fee_pct: 0.003
    taker_fee_pct: 0.009
    leverage: 3                  # isolated; OAI max 6x
    requests_per_minute: 600
  arcus:
    enabled: false
    # https://api.arcus.xyz/v1/feetiers  Base: maker 0 / taker 0.0225% (225 ppm). Update for your tier.
    maker_fee_pct: 0.0
    taker_fee_pct: 0.0225
    requests_per_minute: 120

# Who quotes (maker) in each pair. The other venue is the IOC taker / hedge leg.
roles:
  lighter+lighter_rh: lighter_rh
  lighter+entropy: entropy
  lighter_rh+entropy: entropy
  lighter+arcus: arcus           # quote on Arcus (maker 0), hedge on fee-free Lighter
  lighter_rh+arcus: arcus
  entropy+arcus: arcus           # hedge on Entropy (taker 0.009%) instead of Arcus (0.0225%)

market_data:
  watch_all_venues: false        # live: stream only the two traded venues (monitor always watches all)

trading:
  close_only: false
  allow_preexisting_positions: false
  max_parallel_slices: 1         # >1: quote several symbols at once (recommended with maker_price_mode: threshold)

# v4 (ported from lighter-rh global risk control): instance-wide pauses stop NEW slices (opens and closes)
# for a while; they never touch positions. Alerts only warn (event log, dashboard, terminal bell). null disables.
guards:
  bell: true                     # terminal bell on pauses / warnings
  bell_min_interval_s: 60
  slippage_pause_pct: 0.08       # realised dev - required dev <= -0.08% on one slice -> pause
  slippage_pause_s: 900
  slippage_burst_count: 5        # or this many slices with slippage <= -0.01% ...
  slippage_burst_window_s: 180   # ... within this window -> pause (0 count disables)
  slippage_pause_scope: all      # all: pause the whole instance | symbol: only that symbol
  hedge_latency_max_s: 3.2       # a taker hedge IOC took longer (submit -> final) -> pause
  hedge_latency_pause_s: 1000
  backoff_base_s: 10             # HTTP 429 / rate limit / invalid nonce -> pause base * 2^(n-1) ...
  backoff_max_s: 300             # ... capped; the counter resets after backoff_reset_s without errors
  backoff_reset_s: 600
  api_failure_pause: false       # true: pause after api_failure_count transport errors / 5xx / timeouts in the window
  api_failure_count: 10
  api_failure_window_s: 600
  api_failure_pause_s: 900
  equity_gap_warn_usdc: 1000     # warn when the two venues' equity differs by more (funds never move automatically)
  equity_gap_interval_s: 300
  balance_warn_usdc: null        # e.g. 500: warn when a venue's equity drops below
  adverse_funding_warn_hours: 8  # warn when funding has been against the open position this long ...
  adverse_funding_warn_hourly_pct: 0.01  # ... at >= this net %/h

# v5: add every symbol listed on >= min_venues venues (public market lists at start, cached in data/markets_cache.json).
# Configured symbols below are never changed. Auto symbols are monitored; whether they may OPEN is `trade`:
#   none     = monitor only (default; run monitor a day or two, then `arb rank`)
#   filtered = when the live liquidity filter passes (book spread / depth below)
#   ranked   = the top ranked_top_n of `arb rank --save` (data/rank.json) for this pair, plus the filter
# CLI: --all-symbols turns it on for one run. `symbols: auto` = no hand-written symbols at all.
auto_symbols:
  enabled: true
  min_venues: 2
  trade: none
  ranked_top_n: 15
  include: []                    # whitelist: auto symbols that trade like configured ones, e.g. [NVDA, TSLA]
  exclude: []                    # never add, e.g. [CASHCAT, USELESS]
  max_symbols: null
  max_book_spread_pct: 0.15      # filter: widest bid/ask spread of the two books (EMA ~60s)
  min_depth_usdc: 300            # filter: thinnest side within risk.depth_levels on either book
  filter_configured: false       # also apply the filter to the symbols configured below
  categories: {}                 # fix a classification, e.g. {crypto: [ANSEM], us_equity: [CBRS]}
  templates:                     # parameters per category (merged over defaults)
    us_equity: {strategy: {session: us_equity, initial_threshold_pct: 0.30, grid_step_pct: 0.15, offhours_threshold_pct: 0.60}}
    crypto: {strategy: {initial_threshold_pct: 0.20, grid_step_pct: 0.10}}
    other: {strategy: {initial_threshold_pct: 0.40, grid_step_pct: 0.20}}   # pre-IPO, non-US stocks, FX, metals, unknown

ui:
  sort: gap                      # gap: positions first, then closest to the open trigger | config: file order
  max_book_rows: null            # null = as many as the terminal fits; the rest is summarised below the table

paths:
  data_dir: data
  log_dir: logs

sampler_interval_s: 5
ui_refresh_s: 1

defaults:
  strategy:
    initial_threshold_pct: 0.30
    grid_step_pct: 0.15
    max_grids: 3
    first_close_ratio: 0.5
    grid_value_usdc: 200
    order_value_usdc: 100
    # FIFO two-leg close-profit floor (ported from arcus-maker-lighter-taker): a grid younger than
    # close_floor_timeout_s only closes if opening raw spread + closing raw spread >= min_close_profit_pct
    min_close_profit_pct: 0.01   # null disables
    close_floor_timeout_s: 600
    signal_confirm_s: 0          # >0: an open signal must hold continuously this long (spread persistence; join/improve modes)
    offhours_open: true          # us_equity: false = no new opens outside NY regular hours (closes keep working)
  basis:
    enabled: true
    ema_seconds: 3600
    warmup_seconds: 3600
    drift_seconds: 3600
    max_drift_pct: 0.30
  execution:
    maker_price_mode: join       # join | improve | threshold (rest at the exact trigger price, EMA-centred)
    maker_timeout_s: 20
    requote_threshold_pct: 0.006 # threshold mode: reprice when the fair price moves more than this
    max_order_age_s: 30          # threshold mode: refresh resting orders at least this often
    max_requotes_per_s: 2        # cancel/replace rate limit per symbol (risk cancels bypass it)
    hedge_slippage_pct: 0.05
    hedge_max_attempts: 4        # counts only zero-filled IOCs; partial fills keep hedging
    hedge_min_notional_usdc: 10  # accumulate partial maker fills (dust) until the hedge is >= this
    close_mode: maker_taker      # maker_taker | taker_taker (both legs IOC); CLI: --close-mode
    open_mode: maker_taker       # maker_taker | taker_taker (IOC on both venues, both taker fees); CLI: --open-mode
    emergency_unwind: false      # false: on hedge failure keep both legs, cancel makers, lock for manual intervention
  risk:
    min_available_usdc: 100
    max_symbol_value_usdc: 600
    max_venue_notional_usdc: 2000
    warmup_fresh_s: 60           # continuous fresh two-venue data before quoting (start / reconnect / gap)
    quick_resume_s: 10           # shorter freshness gaps keep the warmup
    max_leverage: 2              # gross notional per venue / (equity * (1 - reserve_ratio))
    reserve_ratio: 0.02
    max_unhedged_notional_usdc: 500
    # v4 (ported from lighter-rh): open-only blocks - closes keep working
    volatility_max_pct: 4.0      # mid range (max-min)/min over volatility_window_s >= this -> no opens; null disables
    volatility_window_s: 300
    volatility_block_s: 900
    reduce_only_block_s: 1800    # venue rejected an open as reduce-only -> no opens on this symbol for this long
    max_leg_spread_pct: null     # e.g. 0.1: no opens while the taker book spread (bid/ask) is wider than this
    max_daily_opens: null        # e.g. 20: max hedged open slices per symbol per UTC day
    max_hold_hours: null         # e.g. 72: warn (dashboard + bell) when the oldest grid is older; never auto-closes

# symbol key -> market name on each venue. A symbol trades on a pair only if both venues list it.
# Arcus names are "<BASE>-USD". Arcus has no OPENAI/ANTHROPIC.
x-us: &us {session: us_equity, offhours_threshold_pct: 0.60}
symbols:
  OPENAI:
    venues: {lighter: OPENAI, lighter_rh: OPENAI, entropy: "io:OAI"}
  ANTHROPIC:
    venues: {lighter: ANTHROPIC, lighter_rh: ANTHROPIC, entropy: "io:ANTH"}
  SNDK:
    venues: {lighter: SNDK, lighter_rh: SNDK, entropy: "io:SNDK", arcus: SNDK-USD}
    strategy: *us
  MU:
    venues: {lighter: MU, lighter_rh: MU, arcus: MU-USD}
    strategy: *us
  AMD:
    venues: {lighter: AMD, lighter_rh: AMD, arcus: AMD-USD}
    strategy: *us
  NVDA:
    venues: {lighter: NVDA, lighter_rh: NVDA, arcus: NVDA-USD}
    strategy: *us
  INTC:
    venues: {lighter: INTC, lighter_rh: INTC, arcus: INTC-USD}
    strategy: *us
  SPCX:
    venues: {lighter: SPCX, lighter_rh: SPCX, arcus: SPCX-USD}
    strategy: *us
  TSLA:
    venues: {lighter: TSLA, lighter_rh: TSLA, arcus: TSLA-USD}
    strategy: *us
  AAPL:
    venues: {lighter: AAPL, lighter_rh: AAPL, arcus: AAPL-USD}
    strategy: *us
  AMZN:
    venues: {lighter: AMZN, lighter_rh: AMZN, arcus: AMZN-USD}
    strategy: *us
  GOOGL:
    venues: {lighter: GOOGL, lighter_rh: GOOGL, arcus: GOOGL-USD}
    strategy: *us
  META:
    venues: {lighter: META, lighter_rh: META, arcus: META-USD}
    strategy: *us
  MSFT:
    venues: {lighter: MSFT, lighter_rh: MSFT, arcus: MSFT-USD}
    strategy: *us
  PLTR:
    venues: {lighter: PLTR, lighter_rh: PLTR, arcus: PLTR-USD}
    strategy: *us
  COIN:
    venues: {lighter: COIN, lighter_rh: COIN, arcus: COIN-USD}
    strategy: *us
  SPY:
    venues: {lighter: SPY, lighter_rh: SPY, arcus: SPY-USD}
    strategy: *us
  QQQ:
    venues: {lighter: QQQ, lighter_rh: QQQ, arcus: QQQ-USD}
    strategy: *us
  NBIS:   # also io:NBIS on Entropy - add it after checking its Entropy fee (growth mode or not)
    venues: {lighter: NBIS, arcus: NBIS-USD}
    strategy: *us
  DRAM:   # also io:DRAM on Entropy - add it after checking its Entropy fee (growth mode or not)
    venues: {lighter: DRAM, arcus: DRAM-USD}
    strategy: *us
  BTC:
    venues: {lighter: BTC, lighter_rh: BTC, arcus: BTC-USD}
    strategy: {initial_threshold_pct: 0.15, grid_step_pct: 0.08}
  ETH:
    venues: {lighter: ETH, lighter_rh: ETH, arcus: ETH-USD}
    strategy: {initial_threshold_pct: 0.15, grid_step_pct: 0.08}
  SOL:
    venues: {lighter: SOL, lighter_rh: SOL, arcus: SOL-USD}
    strategy: {initial_threshold_pct: 0.2, grid_step_pct: 0.1}
  HYPE:
    venues: {lighter: HYPE, lighter_rh: HYPE, arcus: HYPE-USD}
    strategy: {initial_threshold_pct: 0.2, grid_step_pct: 0.1}
